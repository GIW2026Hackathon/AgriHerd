services:
  - type: web
    name: dairyhub-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
  - type: web
    name: dairyhub-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm run start:server
    healthCheckPath: /api/ai/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
